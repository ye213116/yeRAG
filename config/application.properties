# Public model settings for this workspace. Credentials stay in the deployment environment.
# The verified deepseek-chat compatibility alias currently resolves to deepseek-flash.
deepseek.api.model=${DEEPSEEK_API_MODEL:deepseek-flash}
ai.generation.max-tokens=${AI_GENERATION_MAX_TOKENS:8192}
ai.rag.model-profile=${AI_RAG_MODEL_PROFILE:deepseek-v4.1-flash}
ai.rag.context-tokens=${AI_RAG_CONTEXT_TOKENS:1048576}
ai.rag.tokenizer-resource=${AI_RAG_TOKENIZER_RESOURCE:classpath:tokenizers/deepseek-v4/tokenizer.json.gz}
ai.rag.safety-tokens=${AI_RAG_SAFETY_TOKENS:4096}
ai.rag.compression-trigger-ratio=${AI_RAG_COMPRESSION_TRIGGER_RATIO:0.95}
ai.rag.evidence-tokens=${AI_RAG_EVIDENCE_TOKENS:0}
