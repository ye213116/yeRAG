server.address=0.0.0.0
server.port=8081
spring.datasource.url=${DOCKER_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.kafka.bootstrap-servers=${DOCKER_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=yerag-docker
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.yizhaoqi.smartpai.model
spring.kafka.topic.file-processing=file-processing
spring.kafka.topic.dlt=file-processing-dlt
spring.data.redis.host=${DOCKER_REDIS_HOST:redis}
spring.data.redis.port=${DOCKER_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
elasticsearch.host=${DOCKER_ELASTICSEARCH_HOST:es}
elasticsearch.port=${DOCKER_ELASTICSEARCH_PORT:9200}
elasticsearch.scheme=${ELASTICSEARCH_SCHEME:http}
elasticsearch.username=${ELASTICSEARCH_USERNAME:}
elasticsearch.password=${ELASTICSEARCH_PASSWORD:}
minio.endpoint=${DOCKER_MINIO_ENDPOINT:http://minio:19000}
minio.publicUrl=${MINIO_PUBLIC_URL}
minio.accessKey=${MINIO_ACCESS_KEY}
minio.secretKey=${MINIO_SECRET_KEY}
jwt.secret-key=${JWT_SECRET_KEY}
admin.username=${ADMIN_BOOTSTRAP_USERNAME:admin}
admin.password=${ADMIN_BOOTSTRAP_PASSWORD}
admin.primary-org=${ADMIN_BOOTSTRAP_PRIMARY_ORG:default}
admin.org-tags=${ADMIN_BOOTSTRAP_ORG_TAGS:default,admin}
deepseek.api.url=${DEEPSEEK_API_URL}
deepseek.api.key=${DEEPSEEK_API_KEY}
deepseek.api.model=${DEEPSEEK_API_MODEL:deepseek-flash}
embedding.api.url=${EMBEDDING_API_URL}
embedding.api.key=${EMBEDDING_API_KEY}
embedding.api.model=${EMBEDDING_API_MODEL}
embedding.api.dimension=${EMBEDDING_DIMENSION:2048}
embedding.api.batch-size=${EMBEDDING_BATCH_SIZE:100}
file.parsing.chunk-size=1000
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
ai.memory.index-tokens=1024
ai.memory.read-tokens=2048
ai.memory.max-memory-tool-calls=2
ai.rag.evidence-directory=/app/evidence
logging.level.com.yizhaoqi.smartpai=INFO
# WebSocket authentication uses a token in the path; suppress URI-bearing connection logs.
logging.level.com.yizhaoqi.smartpai.handler.ChatWebSocketHandler=WARN
